version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      storybook:
        patterns: ['storybook', '@storybook/*']
      lint:
        patterns: ['eslint*', '@eslint/*', 'typescript-eslint', 'prettier']
      testing:
        patterns: ['vitest', '@vitest/*', '@testing-library/*', '@playwright/test', 'jsdom', '*axe*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
